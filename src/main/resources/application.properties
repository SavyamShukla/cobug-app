spring.application.name=cobug-api

# PostgreSQL (supports Supabase cloud or local development fallback)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cobug}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# HikariCP connection pool settings optimized for Supabase / Cloud pooling
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# COBUG JWT
cobug.jwt.secret=${COBUG_JWT_SECRET:COBUG_LOCAL_DEVELOPMENT_SECRET_KEY_2026_CHANGE_BEFORE_PRODUCTION_123456789}
cobug.jwt.expiration=86400000

# Storage Configuration
# Supported values: auto (default: uses Supabase when configured, otherwise local), supabase, local
cobug.storage.type=${COBUG_STORAGE_TYPE:auto}
cobug.storage.root=${COBUG_STORAGE_ROOT:storage}

# Supabase Storage Configuration (Storage Bucket)
cobug.supabase.url=${SUPABASE_URL:}
cobug.supabase.key=${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_KEY:${SUPABASE_SECRET_KEY:}}}
cobug.supabase.bucket=${SUPABASE_STORAGE_BUCKET:cobug-storage}

# Shared project resource uploads (actual bytes live outside PostgreSQL)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=250MB
server.tomcat.max-part-count=10000
server.tomcat.max-parameter-count=10000
server.tomcat.max-swallow-size=250MB
server.tomcat.max-http-form-post-size=250MB

# Project AI provider.
# Supported values:
#   ollama        -> local Ollama at localhost:11434
#   ollama-cloud  -> direct Ollama Cloud API at https://ollama.com
#   gemini        -> Gemini API
cobug.ai.provider=${COBUG_AI_PROVIDER:ollama}

# Shared Ollama model setting.
# Local example: qwen2.5-coder:3b
# Cloud example: gpt-oss:20b (or another cloud model available to your account)
cobug.ollama.model=${OLLAMA_MODEL:qwen2.5-coder:3b}

# Local Ollama (no API key required)
cobug.ollama.url=${OLLAMA_URL:http://localhost:11434}

# Ollama Cloud direct API
# Backend-only. Never put OLLAMA_API_KEY in VITE_* frontend variables.
cobug.ollama.cloud.url=${OLLAMA_CLOUD_URL:https://ollama.com}
cobug.ollama.cloud.model=${OLLAMA_CLOUD_MODEL:gpt-oss:20b}
cobug.ollama.cloud.api-key=${OLLAMA_API_KEY:}

# Gemini cloud provider (backend-only; never expose this key to the frontend)
cobug.gemini.api-key=${GEMINI_API_KEY:}
cobug.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# Keep development logs readable
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.cobug.security.JwtAuthenticationFilter=WARN
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

# Razorpay payment gateway (Plus plan = ₹99 / 9900 paise, Pro plan = ₹199 / 19900 paise)
cobug.razorpay.key-id=${RAZORPAY_KEY_ID:}
cobug.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
cobug.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
cobug.razorpay.plus-amount-paise=${RAZORPAY_PLUS_AMOUNT_PAISE:9900}
cobug.razorpay.pro-amount-paise=${RAZORPAY_PRO_AMOUNT_PAISE:19900}

# GitHub App integration. The app private key is backend-only and must never be exposed to the frontend.
cobug.github.app.id=${GITHUB_APP_ID:}
cobug.github.app.slug=${GITHUB_APP_SLUG:cobug}
# Needed to prove that the installation_id returned by GitHub belongs to the user who is connecting.
# Backend-only. Never put these in VITE_* frontend variables.
cobug.github.app.client-id=${GITHUB_APP_CLIENT_ID:}
cobug.github.app.client-secret=${GITHUB_APP_CLIENT_SECRET:}
cobug.github.app.private-key=${GITHUB_APP_PRIVATE_KEY:}
cobug.frontend.url=${COBUG_FRONTEND_URL:http://localhost:43127}
cobug.public.api.url=${COBUG_PUBLIC_API_URL:${RENDER_EXTERNAL_URL:https://cobug-app.onrender.com}}
cobug.google.redirect-uri=${GOOGLE_REDIRECT_URI:}

# COBUG source snapshot architecture.
# Small text/source files live in PostgreSQL as content-addressed metadata.
# Large project artifacts and binary assets live in the local COBUG storage folder.
cobug.source.large-file-threshold-bytes=${COBUG_SOURCE_LARGE_FILE_THRESHOLD_BYTES:10485760}
cobug.source.max-file-bytes=${COBUG_SOURCE_MAX_FILE_BYTES:94371840}
cobug.source.max-snapshot-bytes=${COBUG_SOURCE_MAX_SNAPSHOT_BYTES:943718400}

# Authentication / email OTP
cobug.google.client-id=${GOOGLE_CLIENT_ID:}

# Brevo HTTPS API (backend-only; never expose BREVO_API_KEY to the desktop app)
cobug.brevo.api-key=${BREVO_API_KEY:}
cobug.mail.from=${COBUG_MAIL_FROM:}
cobug.mail.from-name=${COBUG_MAIL_FROM_NAME:COBUG}
# Native Google Desktop OAuth (backend only)
cobug.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Detailed authentication diagnostics (secrets/tokens/OTP values are never logged)
logging.level.com.cobug.auth=INFO
logging.level.com.cobug.security.GoogleOAuthService=INFO
logging.level.com.cobug.security.GoogleTokenVerifierService=INFO

# Local intent classification service (CPU). The backend routes only registered read-only
# operators locally; EXTERNAL_COMPLEX, UNKNOWN_OR_AMBIGUOUS and unsupported intents use the selected AI provider.
cobug.intent-detector.url=${COBUG_INTENT_DETECTOR_URL:http://127.0.0.1:8091}
cobug.intent-detector.threshold=${COBUG_INTENT_THRESHOLD:0.15}
