services:
  - type: web
    name: cobug-api
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: COBUG_JWT_SECRET
        generateValue: true
      - key: COBUG_STORAGE_TYPE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: cobug-storage
      - key: COBUG_AI_PROVIDER
        value: ollama
      - key: COBUG_FRONTEND_URL
        value: http://127.0.0.1:43127
      - key: COBUG_PUBLIC_API_URL
        value: https://cobug-app.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://cobug-app.onrender.com/api/auth/google/callback
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        value: cobug
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
